# Publications rendered in the Research section of the landing page (index.md)
# by _includes/publications.html. Keep newest first.
#
# Fields:
#   key        short slug; used for the HTML id and as the thumbnail filename
#   title      paper title
#   authors    list of display names; any entry containing the site author's
#              name is bolded automatically. Add "*" for equal contribution.
#   venue      full venue name, shown in italics
#   year       publication year
#   note       optional trailing text, e.g. "Oral presentation." or where the
#              workshop version appeared
#   thumbnail  image under /assets/images/publications/ (about 640px wide);
#              omit to show placeholder.svg
#   project    optional URL of a project page; when set, the title links to it
#              and a "Project page" link is added
#   links      list of {label, url}. Leave url blank to render a muted
#              "coming soon" placeholder so the gap is visible.
#   bibtex     literal BibTeX block, shown behind a toggle

